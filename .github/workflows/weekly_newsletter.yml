name: Weekly Data & AI Newsletter

on:
  schedule:
    # Runs every Sunday at 09:00 AM IST (03:30 AM UTC)
    - cron: '30 3 * * 0'
  workflow_dispatch: # Allows manual one-click trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Newsletter Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_newsletter.py

      - name: Commit and Push New Edition
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add editions/ edition_*.md
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Auto-publish weekly edition [$(date +'%Y-%m-%d')]"
            git push
          fi
